# pyproject.toml - Python project configuration for SNOW
# SNOW: A Python object-oriented framework for radio-interferometric self-calibration
#
# This file follows PEP 518, PEP 517, and PEP 621 standards for Python project metadata
# and build configuration.

# ============================================================================
# Build System Configuration
# ============================================================================
# Defines the build backend and required build dependencies
[build-system]
# Use setuptools as the build backend (standard for Python packages)
build-backend = "setuptools.build_meta"
# Build dependencies required to build this package
requires = [
  "setuptools>=70.0.0",  # Package building and distribution
  "setuptools-scm>=8",  # Automatic version management from git tags
  "wheel"  # Built distribution format
]

# ============================================================================
# Project Metadata (PEP 621)
# ============================================================================
[project]
# Project authors and maintainers
authors = [
  {name = "Miguel Cárcamo", email = "miguel.carcamo@usach.cl"}
]
# PyPI classifiers for better package discoverability
classifiers = [
  # Development status
  "Development Status :: 4 - Beta",
  # Intended audience
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  # Programming language
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  # License (update if different from LICENSE file)
  "License :: OSI Approved",
  # Operating system
  "Operating System :: OS Independent",
  # Additional metadata
  "Natural Language :: English"
]
# Only the packages snow imports, as lower bounds so snow installs next to other packages
# (e.g. Pyralysis). requirements.txt pins a tested set for CI and Docker.
dependencies = [
  "astropy>=6.1",
  "casatasks>=6.7",
  "casatools>=6.7",
  "multimethod>=1.11",  # Pyralysis 3.0 pins 1.11.2
  "numpy>=1.26",
  "tomli-w>=1.0"
]
description = "A Python object oriented framework to do radio-interferometric self-calibration"
# Resolved at build time: the version comes from git tags via setuptools-scm
dynamic = ["version"]
# Keywords for PyPI search
keywords = [
  "radio astronomy",
  "interferometry",
  "self-calibration",
  "CASA",
  "astronomy",
  "radio interferometry",
  "imaging",
  "calibration"
]
license = {file = "LICENSE"}
maintainers = [
  {name = "Miguel Cárcamo", email = "miguel.carcamo@usach.cl"}
]
# "snow" on PyPI is another project; the import name stays snow
name = "snow-selfcal"
readme = "README.md"
# casatools wheels exist for Python 3.12-3.13 (CASA >= 6.7.2); Pyralysis needs <3.14
requires-python = ">=3.12, <3.14"

# Imagers built by name from configuration files; third-party packages register theirs here too
[project.entry-points."snow.imagers"]
pyralysis = "snow.imaging.backends.pyralysis:Pyralysis"
tclean = "snow.imaging.backends.tclean:Tclean"

[project.optional-dependencies]
# Only snow.selfcalibration.observers.GainPlotObserver needs it
plots = ["matplotlib>=3.8"]
# Pyralysis 3.0.0's fit reads DATA, not CORRECTED_DATA (fixed in 3.1.0). PyPI only has older
# versions: install it from its release tag, as the README shows. It depends on
# ska-ost-array-config, published on SKA's index.
pyralysis = ["pyralysis>=3.1.0"]
# Only snow.utils.reproject() needs it; it pulls in dask, zarr and image libraries
reproject = ["reproject>=0.14"]
test = ["matplotlib>=3.8", "pytest>=8", "reproject>=0.14"]

# Project URLs (homepage, repository, documentation, etc.)
[project.urls]
Homepage = "https://github.com/miguelcarcamov/snow"
Repository = "https://github.com/miguelcarcamov/snow"
Source = "https://github.com/miguelcarcamov/snow"

[tool.pytest]

[tool.pytest.ini_options]
markers = ["casa: runs real CASA tasks (tests/integration, skipped without CASA)"]

# Setuptools-specific configuration
[tool.setuptools]

# Package discovery configuration
[tool.setuptools.packages.find]
# Find all packages starting with "snow"
include = ["snow*"]
# Don't use namespace packages
namespaces = false
# Look for packages in the src directory
where = ["src"]

# ============================================================================
# setuptools-scm Configuration
# ============================================================================
# Automatic version management from git tags
# When version is in [project] dynamic, setuptools-scm automatically provides it
[tool.setuptools_scm]
# Don't add local version identifier (e.g., +dirty, +local)
local_scheme = "no-local-version"
