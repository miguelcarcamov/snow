name: build-latest-container

on:
  pull_request:
    branches: [master]
    paths:
    - '**.py'
    - .github/workflows/build_latest_container.yaml
    - Dockerfile.prod
  release:
    types: [published]

# Superseded pull request runs are cancelled; release runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'

permissions:
  contents: read
  packages: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        set-safe-directory: true
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Check git version and our path
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
    - name: Install yapf
      run: |
        python -m pip install --upgrade pip
        pip install yapf==0.43.0  # same version as .pre-commit-config.yaml
    - name: Run yapf
      run: |
        yapf --recursive --verbose --diff .
  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm derives the version from the tags
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        pip install build
        python -m build
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: snow-artifacts
        path: dist/*
  build-latest-container:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
    # The image installs the wheel built and tested by the build job, i.e. this exact commit.
    - name: Download built package
      uses: actions/download-artifact@v4
      with:
        name: snow-artifacts
        path: dist/
    - name: Free up disk space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        df -h
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.repository_owner }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    - name: Setup Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Prune Docker system
      run: docker system prune -af --volumes || true
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile.prod
        # Pull requests only check that the image builds; releases publish it.
        push: ${{ github.event_name == 'release' }}
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}:latest
          ${{ github.event_name == 'release' && format('{0}/{1}:{2}', env.REGISTRY, github.repository, github.event.release.tag_name) || '' }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILDKIT_INLINE_CACHE=1
