name: build

on:
  push:
    branches: [development]
  pull_request:
    branches:
    - development
    - master

# Superseded pull request runs are cancelled; pushes always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: '3.12'

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install yapf
      run: |
        python -m pip install --upgrade pip
        pip install yapf==0.43.0  # same version as .pre-commit-config.yaml
    - name: Run yapf
      run: |
        yapf --recursive --verbose --diff .

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # setuptools-scm derives the version from the tags
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Build sdist and wheel
      run: |
        python -m pip install --upgrade pip
        pip install build twine
        python -m build
        twine check --strict dist/*
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: snow-artifacts
        path: dist/*

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: pip
        cache-dependency-path: requirements.txt
    - uses: actions/download-artifact@v4
      with:
        name: snow-artifacts
        path: dist/
    # The tests run against the built wheel with the pinned dependency set, not the source tree
    - name: Install snow from the built wheel
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt "$(ls dist/*.whl)[test]"
    # CASA reads its measures data when casatools is imported. As in the Docker image, only the
    # measures are fetched (not the ~1 GB casarundata), once a day at most.
    - name: Date for the CASA data cache
      id: date
      run: echo "today=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
    - name: Cache CASA data
      id: casa-data
      uses: actions/cache@v4
      with:
        path: ~/.casa/data
        key: casa-measures-${{ steps.date.outputs.today }}
        restore-keys: casa-measures-
    - name: Fetch CASA measures data
      if: steps.casa-data.outputs.cache-hit != 'true'
      run: |
        mkdir -p ~/.casa/data
        # A slow or failing server is fine if an earlier day's copy was restored from the cache
        python -c "from casaconfig import measures_update; measures_update('$HOME/.casa/data', use_astron_obs_table=True, force=True)" \
          || test -d ~/.casa/data/geodetic
    - name: Turn CASA data auto updates off
      run: |
        mkdir -p ~/.casa
        printf '%s\n' 'measures_auto_update = False' 'data_auto_update = False' > ~/.casa/config.py
    - name: Import snow with CASA
      run: python -c "import snow, snow.imaging, snow.selfcalibration; print(snow.__version__)"
    - name: Run tests
      run: pytest tests -q
