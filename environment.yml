# Conda environment file for the SNOW (Self-calibration) project
# SNOW: A Python object-oriented framework for radio-interferometric self-calibration
#
# To create this environment:
#   conda env create -f environment.yml
#
# To update this environment:
#   conda env update -f environment.yml --prune
#
# To activate this environment:
#   conda activate snow-env

name: snow-env

channels:
- conda-forge

dependencies:
  # The CASA wheels support Python 3.12-3.13; Pyralysis needs <3.14 (#30)
- python=3.12
- pip
  # CASA and the other dependencies come from PyPI, pinned to the set tested in CI
- pip:
  - -r requirements.txt
